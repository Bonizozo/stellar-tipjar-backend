services:
  db:
    # postgis/postgis bundles the PostGIS extension required by migration
    # 0056 (creator_locations); plain postgres:15-alpine lacks it.
    image: postgis/postgis:15-3.4-alpine
    container_name: tipjar-db
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: tipjar
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d tipjar"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: tipjar-backend
    ports:
      - "8000:8000"
    volumes:
      - .:/app
      - /app/target # Prevents local target folder from overwriting container target
    environment:
      - DATABASE_URL=postgres://user:password@db:5432/tipjar
      - STELLAR_NETWORK=testnet
      - RUST_LOG=stellar_tipjar_backend=debug
      - RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672/%2f
      # OpenTelemetry — active when observability profile is included.
      # Override with: OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4317
      - OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      - OTEL_SERVICE_NAME=stellar-tipjar-backend
      - OTEL_SAMPLE_RATIO=${OTEL_SAMPLE_RATIO:-1.0}
      - DEPLOYMENT_ENVIRONMENT=local
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: tipjar-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - ./monitoring/prometheus/recording_rules.yml:/etc/prometheus/recording_rules.yml:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.enable-lifecycle"
    depends_on:
      - backend

  grafana:
    image: grafana/grafana:10.4.0
    container_name: tipjar-grafana
    ports:
      - "3000:3000"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/etc/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    depends_on:
      - prometheus

  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: tipjar-rabbitmq
    ports:
      - "5672:5672"    # AMQP
      - "15672:15672"  # Management UI  →  http://localhost:15672  (guest/guest)
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  kong:
    image: kong:3.7-ubuntu
    container_name: tipjar-kong
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /etc/kong/kong.yml
      KONG_PROXY_LISTEN: "0.0.0.0:8080"
      KONG_ADMIN_LISTEN: "0.0.0.0:8001"
      KONG_LOG_LEVEL: info
      KONG_PLUGINS: bundled
    ports:
      - "8080:8080"   # Proxy (public entry point)
      - "8001:8001"   # Admin API (internal only)
    volumes:
      - ./kong/kong.yml:/etc/kong/kong.yml:ro
    healthcheck:
      test: ["CMD", "kong", "health"]
      interval: 10s
      timeout: 5s
      retries: 5
    depends_on:
      backend:
        condition: service_started

  # ── OpenTelemetry Collector ─────────────────────────────────────────────────
  # Receives OTLP spans from the backend and forwards to Jaeger.
  # Activate with:  docker compose --profile observability up
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.99.0
    container_name: tipjar-otel-collector
    profiles:
      - observability
    command: ["--config=/etc/otel/config.yaml"]
    volumes:
      - ./monitoring/otel/otel-collector.yaml:/etc/otel/config.yaml:ro
    ports:
      - "4317:4317"   # OTLP gRPC receiver (used by the backend)
      - "4318:4318"   # OTLP HTTP receiver
      - "8889:8889"   # Prometheus metrics exporter (scraped by Prometheus)
    depends_on:
      - jaeger
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:13133"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Jaeger all-in-one ───────────────────────────────────────────────────────
  # Trace backend — view at http://localhost:16686
  jaeger:
    image: jaegertracing/all-in-one:1.57
    container_name: tipjar-jaeger
    profiles:
      - observability
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686"  # Jaeger UI
      - "14250:14250"  # gRPC model.proto receiver (used by otel-collector)
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:14269"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  prometheus_data:
  grafana_data:
  rabbitmq_data:
